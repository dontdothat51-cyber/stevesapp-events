# Steve's App LIVE EVENTS pack -- the always-on publisher (2026-09-22).
# Every 10 minutes, around the clock: read ~40 public ESPN scoreboards, normalize to one gzip JSON, and hand it to the
# app's server through its publish door, which validates it and stores only the events files. Devices never call ESPN.
# Two triggers: GitHub's own cron (best effort, may lag) and workflow_dispatch fired by the server's own clock every
# 10 minutes. The door skips an older-or-same version, so overlapping runs never fight.
# Secret required: EVENTS_PUBLISH_KEY (single-purpose: it can publish an events pack and nothing else).
name: events
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
concurrency:
  group: events-pack
  cancel-in-progress: false
jobs:
  events-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build the events pack from the ESPN boards
        run: python3 tools/build_eventspack.py
      - name: Publish through the server's publish door
        env:
          EVENTS_PUBLISH_KEY: ${{ secrets.EVENTS_PUBLISH_KEY }}
        run: python3 tools/publish_events_http.py
      - name: Receipt
        run: python3 -c "import json; m=json.load(open('cdn/events_manifest.json')); print('events pack', m['version'], m['events'], 'events,', m['live'], 'live, boards failed:', m['failed'])"
